pack: tls
title: TLS certificates and private keys
description: Certificates and private keys referenced by nginx (ssl_certificate), Apache (SSLCertificateFile), Postfix (smtpd_tls_*) and Dovecot (ssl_cert/ssl_key). nginx expiry is reported by the original tls:cert-expiry check, so the expiry checks here cover the other services.
category: tls
references:
  - https://ssl-config.mozilla.org/
