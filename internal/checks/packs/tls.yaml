checks:
  - id: tls:expired
    title: "TLS certificate expired: {path}"
    description: An expired certificate used by Apache, Postfix or Dovecot breaks clients and trains users (and MTAs) to accept certificate errors.
    severity: high
    probe: {type: x509, from: [apache, postfix, dovecot]}
    expect: [expired eq false]
    evidence: "{path}: {subject} expired on {not_after}"
    remediation: Renew the certificate and reload the service; automate renewal (certbot/acme.sh timers).
    references: [https://letsencrypt.org/docs/]
    tests:
      pass: {files: {/etc/postfix/main.cf: "smtpd_tls_cert_file = /etc/ssl/lync/good.pem\n"}}
      fail: {files: {/etc/postfix/main.cf: "smtpd_tls_cert_file = /etc/ssl/lync/expired.pem\n"}}

  - id: tls:expiring-soon
    title: "TLS certificate expires within 21 days: {path}"
    description: A certificate used by Apache, Postfix or Dovecot expires within three weeks; automated renewal is probably not working.
    severity: medium
    probe: {type: x509, from: [apache, postfix, dovecot]}
    where: [expired eq false]
    expect: [days_left ge 21]
    evidence: "{path}: {subject} expires on {not_after} ({days_left} days)"
    remediation: Renew the certificate and check the renewal timer/cron job.
    references: [https://letsencrypt.org/docs/integration-guide/#when-to-renew]
    tests:
      pass: {files: {/etc/dovecot/conf.d/10-ssl.conf: "ssl_cert = </etc/ssl/lync/good.pem\n"}}
      fail: {files: {/etc/dovecot/conf.d/10-ssl.conf: "ssl_cert = </etc/ssl/lync/soon.pem\n"}}

  - id: tls:weak-rsa-key
    title: "TLS certificate uses an RSA key shorter than 2048 bits: {path}"
    description: RSA keys below 2048 bits are within reach of well-funded attackers and rejected by current clients.
    severity: high
    probe: {type: x509, from: [nginx, apache, postfix, dovecot]}
    where: [key_type eq rsa]
    expect: [key_bits ge 2048]
    evidence: "{path}: RSA {key_bits} bits"
    remediation: Issue a new certificate with an RSA 2048+/3072 or ECDSA P-256 key.
    references: [https://csrc.nist.gov/publications/detail/sp/800-131a/rev-2/final]
    tests:
      pass: {files: {/etc/nginx/nginx.conf: "events {}\nhttp { server { listen 443 ssl; ssl_certificate /etc/ssl/lync/good.pem; } }\n"}}
      fail: {files: {/etc/nginx/nginx.conf: "events {}\nhttp { server { listen 443 ssl; ssl_certificate /etc/ssl/lync/rsa1024.pem; } }\n"}}

  - id: tls:weak-signature
    title: "TLS certificate signed with SHA-1 or MD5: {path}"
    description: SHA-1 and MD5 certificate signatures are forgeable (chosen-prefix collisions) and rejected by modern clients.
    severity: medium
    probe: {type: x509, from: [nginx, apache, postfix, dovecot]}
    expect: ['sig_alg not_regex (?i)(md5|sha1)']
    severity_if:
      - {when: 'sig_alg regex (?i)md5', severity: high}
    evidence: "{path}: signature algorithm {sig_alg}"
    remediation: Reissue the certificate with a SHA-256 (or better) signature.
    references: [https://shattered.io/]
    tests:
      pass: {files: {/etc/postfix/main.cf: "smtpd_tls_cert_file = /etc/ssl/lync/ec.pem\n"}}
      fail: {files: {/etc/postfix/main.cf: "smtpd_tls_cert_file = /etc/ssl/lync/sha1.pem\n"}}

  - id: tls:self-signed
    title: "Web server uses a self-signed certificate: {path}"
    description: Visitors cannot verify a self-signed certificate, so they learn to click through warnings and can be intercepted.
    severity: low
    level: strict
    probe: {type: x509, from: [nginx, apache]}
    expect: [self_signed eq false]
    evidence: "{path}: self-signed ({subject})"
    remediation: Use a certificate from a public CA (e.g. Let's Encrypt) or your internal CA.
    references: [https://letsencrypt.org/getting-started/]
    tests:
      pass: {files: {/etc/nginx/nginx.conf: "events {}\nhttp { server { listen 443 ssl; ssl_certificate /etc/ssl/lync/good.pem; } }\n"}}
      fail: {files: {/etc/nginx/nginx.conf: "events {}\nhttp { server { listen 443 ssl; ssl_certificate /etc/ssl/lync/self.pem; } }\n"}}

  - id: tls:key-world-readable
    title: "TLS private key readable by any user: {path}"
    description: Any local user can copy a world-readable private key and impersonate the service or decrypt captured traffic (non-PFS suites).
    severity: high
    level: basic
    probe: {type: file, from: [nginx-key, apache-key, postfix-key, dovecot-key]}
    expect: [mode bits_none 0004]
    remediation: Make the key readable only by root (and the service group if it reads keys after dropping privileges); then rotate it.
    fix: chmod 600 {path}
    references: [https://www.openssl.org/docs/manmaster/man1/openssl-genpkey.html]
    tests:
      pass: {files: {/etc/postfix/main.cf: "smtpd_tls_key_file = /etc/ssl/private/mail.key\n", /etc/ssl/private/mail.key: "placeholder\n"}, meta: {/etc/ssl/private/mail.key: "0600 0 0"}}
      fail: {files: {/etc/postfix/main.cf: "smtpd_tls_key_file = /etc/ssl/private/mail.key\n", /etc/ssl/private/mail.key: "placeholder\n"}, meta: {/etc/ssl/private/mail.key: "0644 0 0"}}

  - id: tls:key-writable
    title: "TLS private key writable by group or others: {path}"
    description: Someone who can replace the key (and certificate) can make the service present an attacker-controlled identity.
    severity: high
    probe: {type: file, from: [nginx-key, apache-key, postfix-key, dovecot-key]}
    expect: [mode bits_none 0022]
    remediation: Remove group/other write permission from the key.
    fix: chmod go-w {path}
    references: [https://ssl-config.mozilla.org/]
    tests:
      pass: {files: {/etc/nginx/nginx.conf: "events {}\nhttp { server { ssl_certificate_key /etc/ssl/private/web.key; } }\n", /etc/ssl/private/web.key: "placeholder\n"}, meta: {/etc/ssl/private/web.key: "0640 0 0"}}
      fail: {files: {/etc/nginx/nginx.conf: "events {}\nhttp { server { ssl_certificate_key /etc/ssl/private/web.key; } }\n", /etc/ssl/private/web.key: "placeholder\n"}, meta: {/etc/ssl/private/web.key: "0660 0 33"}}

  - id: tls:key-not-root-owned
    title: "TLS private key not owned by root: {path}"
    description: Keys owned by a service account can be read or replaced by anyone who compromises that service.
    severity: low
    level: strict
    probe: {type: file, from: [nginx-key, apache-key, postfix-key, dovecot-key]}
    expect: [uid eq 0]
    remediation: chown root:root (or root:ssl-cert) and grant read access through the group only.
    fix: chown root {path}
    references: [https://ssl-config.mozilla.org/]
    tests:
      pass: {files: {/etc/postfix/main.cf: "smtpd_tls_key_file = /etc/ssl/private/mail.key\n", /etc/ssl/private/mail.key: "placeholder\n"}, meta: {/etc/ssl/private/mail.key: "0600 0 0"}}
      fail: {files: {/etc/postfix/main.cf: "smtpd_tls_key_file = /etc/ssl/private/mail.key\n", /etc/ssl/private/mail.key: "placeholder\n"}, meta: {/etc/ssl/private/mail.key: "0600 33 33"}}

  - id: tls:letsencrypt-dir-perms
    title: "Let's Encrypt key directory accessible to other users: {path}"
    description: Certbot creates /etc/letsencrypt/archive and live as 0700; opening them lets local users read every issued private key (older certbot versions create the key files themselves 0644).
    severity: high
    probe: {type: file, path: [/etc/letsencrypt/archive, /etc/letsencrypt/live], no_follow: true}
    expect: [mode bits_none 0005]
    remediation: Restore the directory permissions.
    fix: chmod 700 {path}
    references: [https://eff-certbot.readthedocs.io/en/stable/using.html#where-are-my-certificates]
    tests:
      pass: {meta: {/etc/letsencrypt/archive: "d0700 0 0", /etc/letsencrypt/live: "d0700 0 0"}}
      fail: {meta: {/etc/letsencrypt/archive: "d0755 0 0", /etc/letsencrypt/live: "d0700 0 0"}}
