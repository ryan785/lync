pack: accounts
title: Local accounts and groups
description: Password hashes, legacy NIS entries, privileged group membership and system accounts with interactive shells (/etc/passwd, /etc/shadow, /etc/group).
category: config
references:
  - https://www.cisecurity.org/cis-benchmarks
  - https://man7.org/linux/man-pages/man5/passwd.5.html
checks:
  - id: account:passwd-hash
    title: Password hash stored in world-readable /etc/passwd
    description: An account whose password field in /etc/passwd is not 'x' keeps its hash in a file every user can read, so it can be cracked offline.
    severity: high
    tags: [cis]
    probe: {type: content, path: /etc/passwd, regex: '^[^:#\n]+:[^:x*!\n][^:\n]*:', secret: true}
    expect: ["match eq false"]
    evidence: "{path}:{lineno}: password field is not 'x' (hash not shadowed)"
    remediation: Move hashes to /etc/shadow with pwconv and set new passwords for the affected accounts.
    fix: pwconv
    tests:
      pass: {files: {/etc/passwd: "root:x:0:0:root:/root:/bin/bash\nbin:*:1:1::/:/sbin/nologin\n"}}
      fail: {files: {/etc/passwd: "root:x:0:0:root:/root:/bin/bash\nold:$1$lync-test-secret:1001:1001::/home/old:/bin/sh\n"}}

  - id: account:nis-plus-entry
    title: Legacy '+' NIS entry in an account database
    description: A line starting with '+' in passwd/shadow/group imports NIS entries and, on some systems, creates an account with no password.
    severity: medium
    tags: [cis]
    probe: {type: content, path: [/etc/passwd, /etc/shadow, /etc/group], regex: '^\+'}
    expect: ["match eq false"]
    remediation: Remove the '+' lines; use nsswitch.conf to add directory sources.
    fix: "sed -i '/^+/d' {path}"
    tests:
      pass: {files: {/etc/passwd: "root:x:0:0:root:/root:/bin/bash\n", /etc/group: "root:x:0:\n"}}
      fail: {files: {/etc/passwd: "root:x:0:0:root:/root:/bin/bash\n+::::::\n", /etc/group: "root:x:0:\n"}, findings: 1}

  - id: account:weak-hash
    title: Account password uses an obsolete hash (MD5 or DES)
    description: MD5-crypt and DES hashes can be cracked quickly on commodity GPUs; a leaked /etc/shadow then exposes the password.
    severity: high
    tags: [cis]
    probe: {type: shadow}
    where: ["hash_type in md5,des"]
    expect_none: true
    evidence: "{_loc}: hash type {hash_type}"
    remediation: Set ENCRYPT_METHOD SHA512 or YESCRYPT in /etc/login.defs and make the user set a new password.
    fix: "passwd -e {name}   # forces a new (strongly hashed) password at next login"
    tests:
      pass: {files: {/etc/shadow: "root:$6$abc$def:19000:0:99999:7:::\nbin:*:19000:0:99999:7:::\n"}}
      fail: {files: {/etc/shadow: "root:$6$abc$def:19000:0:99999:7:::\nold:$1$salt$lynctestsecret:19000:0:99999:7:::\n"}}
      skip: {files: {}}

  - id: account:no-max-age
    title: Password never expires for an account with a password
    description: Accounts with a password and maximum age 99999 never have to rotate it. Only matters where passwords (not keys) are used to log in.
    severity: low
    level: strict
    tags: [cis]
    probe: {type: shadow}
    where: ["password_set eq true"]
    expect: ["max le 365"]
    remediation: Set a maximum password age for the account (and PASS_MAX_DAYS in /etc/login.defs for new ones).
    fix: "chage --maxdays 365 {name}"
    tests:
      pass: {files: {/etc/shadow: "alice:$6$a$b:19000:1:180:7:::\n"}}
      fail: {files: {/etc/shadow: "alice:$6$a$b:19000:0:99999:7:::\n"}}

  - id: account:inactive-default
    title: Accounts are never disabled after password expiry
    description: useradd's INACTIVE default of -1 keeps accounts with expired passwords usable forever; CIS recommends 45 days or less.
    severity: low
    level: strict
    tags: [cis]
    probe: {type: config, format: kv, path: /etc/default/useradd, key: inactive, default: "-1"}
    expect: ["value ge 0", "value le 45"]
    remediation: Set a default inactivity period for new accounts.
    fix: useradd -D -f 45
    tests:
      pass: {files: {/etc/default/useradd: "GROUP=100\nINACTIVE=30\n"}}
      fail: {files: {/etc/default/useradd: "GROUP=100\nINACTIVE=-1\n"}}

  - id: account:gid0-group
    title: Group other than root has GID 0
    description: A second group with GID 0 grants root-group file access to its members under a different name.
    severity: medium
    tags: [cis]
    probe: {type: group}
    where: ["gid eq 0"]
    expect: ["name eq root"]
    remediation: Give the group a unique GID or delete it.
    fix: "groupmod -g <new-gid> {name}"
    tests:
      pass: {files: {/etc/group: "root:x:0:\nwheel:x:10:alice\n"}}
      fail: {files: {/etc/group: "root:x:0:\ntoor:x:0:\n"}}

  - id: account:shadow-group-members
    title: Users are members of the shadow group
    description: Members of the shadow group can read /etc/shadow on Debian/Ubuntu and crack every password hash offline.
    severity: medium
    tags: [cis]
    probe: {type: group}
    where: ["name eq shadow"]
    expect: ["members empty"]
    evidence: "{_loc}: members {members}"
    remediation: Remove users from the shadow group.
    fix: "gpasswd -d <user> shadow"
    tests:
      pass: {files: {/etc/group: "root:x:0:\nshadow:x:42:\n"}}
      fail: {files: {/etc/group: "root:x:0:\nshadow:x:42:alice\n"}}

  - id: account:root-primary-group
    title: Non-system account has root (GID 0) as its primary group
    description: Files created by such users are owned by group root, and group-root-readable files become readable to them.
    severity: low
    level: strict
    tags: [cis]
    probe: {type: passwd}
    where: ["gid eq 0", "name not_in root,sync,shutdown,halt,operator"]
    expect_none: true
    evidence: "{_loc}: primary GID 0"
    remediation: Give the account its own primary group.
    fix: "usermod -g <group> {name}"
    tests:
      pass: {files: {/etc/passwd: "root:x:0:0:root:/root:/bin/bash\nsync:x:5:0:sync:/sbin:/bin/sync\n"}}
      fail: {files: {/etc/passwd: "root:x:0:0:root:/root:/bin/bash\nbob:x:1001:0::/home/bob:/bin/bash\n"}}

  - id: account:system-login-shell
    title: System account has an interactive login shell
    description: Service accounts (UID 1-999) should use nologin so a leaked service credential or misconfiguration can't produce an interactive session. Some packages (e.g. postgres on Debian) ship a shell deliberately.
    severity: low
    level: strict
    tags: [cis]
    probe: {type: passwd}
    where: ["uid gt 0", "uid lt 1000", "login eq true", "name not_in sync,shutdown,halt"]
    expect_none: true
    evidence: "{_loc}: uid {uid}, shell {shell}"
    remediation: Set the shell to nologin for service accounts that don't need interactive logins.
    fix: "usermod -s $(command -v nologin) {name}"
    tests:
      pass: {files: {/etc/passwd: "root:x:0:0:root:/root:/bin/bash\ndaemon:x:2:2::/sbin:/usr/sbin/nologin\nalice:x:1000:1000::/home/alice:/bin/bash\n"}}
      fail: {files: {/etc/passwd: "root:x:0:0:root:/root:/bin/bash\nftp:x:14:50::/var/ftp:/bin/bash\n"}}

  - id: account:shell-timeout
    title: No idle shell timeout (TMOUT) configured
    description: Without TMOUT, abandoned root shells on consoles and SSH sessions stay open indefinitely.
    severity: low
    level: strict
    tags: [cis]
    probe:
      type: content
      path: [/etc/profile, /etc/profile.d/*.sh, /etc/bashrc, /etc/bash.bashrc]
      regex: '^\s*(readonly\s+|export\s+|declare\s+-r\s+|typeset\s+-r\s+)?TMOUT=([1-9][0-9]?|[1-8][0-9]{2}|900)\b'
      combine: true
    expect: ["match eq true"]
    remediation: Set a readonly TMOUT of 900 seconds or less for all shells.
    fix: "printf 'readonly TMOUT=900\\nexport TMOUT\\n' > /etc/profile.d/60-lync-tmout.sh"
    tests:
      pass: {files: {/etc/profile: "PATH=/usr/bin\n", /etc/profile.d/tmout.sh: "readonly TMOUT=600 ; export TMOUT\n"}}
      fail: {files: {/etc/profile: "PATH=/usr/bin\nTMOUT=3600\n"}}

  - id: account:nologin-in-shells
    title: nologin is listed in /etc/shells
    description: /etc/shells lists valid login shells; listing nologin lets programs that trust it (ftp daemons, chsh) treat no-login accounts as normal users.
    severity: low
    level: strict
    tags: [cis]
    probe: {type: content, path: /etc/shells, regex: '/nologin\s*$'}
    expect: ["match eq false"]
    remediation: Remove nologin from /etc/shells.
    fix: "sed -i '/nologin/d' /etc/shells"
    tests:
      pass: {files: {/etc/shells: "/bin/sh\n/bin/bash\n"}}
      fail: {files: {/etc/shells: "/bin/bash\n/usr/sbin/nologin\n"}}
