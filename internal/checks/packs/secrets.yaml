pack: secrets
title: Secrets hygiene (keys, credential files, shell history)
description: Private keys and credential files readable by other local users, and credentials typed on the command line that ended up in shell history. Findings name files and line numbers only, never the secret.
category: filesystem
references:
  - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
checks:
  - id: secrets:ssh-private-key-readable
    title: SSH private key {path} is readable by other users
    description: A user's private key that group or others can read lets any local account (or compromised service) log in wherever that key is trusted.
    severity: high
    probe: {type: file, path: [/root/.ssh/id_*, /home/*/.ssh/id_*]}
    where: ['path not_regex \.pub$']
    expect: ["mode bits_none 0044"]
    remediation: Restrict the key to its owner and consider rotating it if other users had access.
    fix: "chmod 600 {path}"
    references: [https://man.openbsd.org/ssh#FILES]
    tests:
      pass: {files: {/home/alice/.ssh/id_ed25519: "k", /home/alice/.ssh/id_ed25519.pub: "ssh-ed25519 AAAA"}, meta: {/home/alice/.ssh/id_ed25519: "0600 1000 1000", /home/alice/.ssh/id_ed25519.pub: "0644 1000 1000"}}
      fail: {files: {/root/.ssh/id_rsa: "k"}, meta: {/root/.ssh/id_rsa: "0644 0 0"}}

  - id: secrets:tls-private-key-readable
    title: TLS private key {path} is readable by other users
    description: Anyone who can read a server's TLS private key can impersonate the service or decrypt captured non-PFS traffic.
    severity: high
    probe: {type: file, path: [/etc/ssl/private/*, /etc/pki/tls/private/*]}
    where: [type eq file]
    expect: ["mode bits_none 0004"]
    remediation: Make private keys readable only by root (and the ssl-cert group on Debian), then consider re-issuing the certificate.
    fix: "chmod 600 {path} (or 640 root:ssl-cert)"
    tests:
      pass: {files: {/etc/ssl/private/ssl-cert-snakeoil.key: "k"}, meta: {/etc/ssl/private/ssl-cert-snakeoil.key: "0640 0 110"}}
      fail: {files: {/etc/pki/tls/private/site.key: "k"}, meta: {/etc/pki/tls/private/site.key: "0644 0 0"}}

  - id: secrets:credential-file-readable
    title: Credential file {path} is readable by other users
    description: Cloud CLI credentials (AWS, gcloud, Azure), rclone/s3cmd configs, git-credentials, .netrc and the GitHub CLI token file store long-lived secrets in clear text; they must be private to their owner.
    severity: high
    probe:
      type: file
      path:
        - /root/.aws/credentials
        - /home/*/.aws/credentials
        - /root/.config/gcloud/credentials.db
        - /home/*/.config/gcloud/credentials.db
        - /root/.azure/msal_token_cache.json
        - /home/*/.azure/msal_token_cache.json
        - /root/.config/rclone/rclone.conf
        - /home/*/.config/rclone/rclone.conf
        - /root/.s3cfg
        - /home/*/.s3cfg
        - /root/.git-credentials
        - /home/*/.git-credentials
        - /root/.netrc
        - /home/*/.netrc
        - /root/.config/gh/hosts.yml
        - /home/*/.config/gh/hosts.yml
        - /root/.vault-token
        - /home/*/.vault-token
        - /root/.terraform.d/credentials.tfrc.json
        - /home/*/.terraform.d/credentials.tfrc.json
        - /root/.config/doctl/config.yaml
        - /home/*/.config/doctl/config.yaml
    expect: ["mode bits_none 0044"]
    remediation: Restrict the file to its owner and rotate the credentials it contains if other users could read it.
    fix: "chmod 600 {path}"
    tests:
      pass: {files: {/home/bob/.aws/credentials: "[default]\n"}, meta: {/home/bob/.aws/credentials: "0600 1000 1000"}}
      fail: {files: {/root/.git-credentials: "x"}, meta: {/root/.git-credentials: "0644 0 0"}}

  - id: secrets:kubeconfig-readable
    title: kubeconfig {path} is readable by other users
    description: A kubeconfig carries cluster credentials (client certificates or bearer tokens); other users who read it get the same cluster access.
    severity: high
    probe: {type: file, path: [/root/.kube/config, /home/*/.kube/config]}
    expect: ["mode bits_none 0044"]
    remediation: Restrict the kubeconfig to its owner.
    fix: "chmod 600 {path}"
    references: [https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/]
    tests:
      pass: {files: {/root/.kube/config: "apiVersion: v1\n"}, meta: {/root/.kube/config: "0600 0 0"}}
      fail: {files: {/home/dev/.kube/config: "apiVersion: v1\n"}, meta: {/home/dev/.kube/config: "0644 1000 1000"}}

  - id: secrets:docker-config-readable
    title: Docker client config {path} is readable by other users
    description: ~/.docker/config.json stores registry credentials (base64 "auth" entries) unless a credential helper is used.
    severity: medium
    probe: {type: file, path: [/root/.docker/config.json, /home/*/.docker/config.json]}
    expect: ["mode bits_none 0044"]
    remediation: Restrict the file to its owner, or configure a credential helper (credsStore).
    fix: "chmod 600 {path}"
    references: [https://docs.docker.com/reference/cli/docker/login/#credential-stores]
    tests:
      pass: {files: {/root/.docker/config.json: "{}"}, meta: {/root/.docker/config.json: "0600 0 0"}}
      fail: {files: {/root/.docker/config.json: "{}"}, meta: {/root/.docker/config.json: "0644 0 0"}}

  - id: secrets:shell-history-credentials
    title: Shell history {path} contains credentials
    description: A command line with a password or token (mysql -p..., --password=, sshpass -p, curl -u user:pass, cloud/git tokens) was saved to shell history. Only the file and line number are reported.
    severity: medium
    probe:
      type: content
      path: [/root/.bash_history, /home/*/.bash_history, /root/.zsh_history, /home/*/.zsh_history, /root/.mysql_history, /home/*/.mysql_history]
      regex: '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{16,}|xox[abprs]-[A-Za-z0-9-]{10,}|--password[= ]\S|PGPASSWORD=\S|\bmysql(dump|admin)?\b.*\s-p\S|sshpass\s+-p\s*\S|\bcurl\b.*\s(-u|--user)\s+\S+:\S|IDENTIFIED BY\s+''[^'']+'')'
      secret: true
    expect: [match eq false]
    remediation: Rotate the exposed credential, remove the line from the history file, and pass secrets via prompts, option files (~/.my.cnf with 0600) or environment files instead of arguments.
    tests:
      pass: {files: {/root/.bash_history: "ls -la\nmysql -u root -p\nsystemctl restart nginx\n"}}
      fail: {files: {/home/dev/.bash_history: "cd /srv\nmysql -u root -plync-test-secret app\n"}}

  - id: secrets:shell-history-readable
    title: Shell history {path} is readable by other users
    description: Shell history reveals commands, paths and occasionally credentials; bash creates it 0600 by default.
    severity: low
    probe: {type: file, path: [/root/.bash_history, /home/*/.bash_history, /root/.zsh_history, /home/*/.zsh_history]}
    expect: ["mode bits_none 0044"]
    remediation: Restrict the history file to its owner.
    fix: "chmod 600 {path}"
    tests:
      pass: {files: {/home/dev/.bash_history: "ls\n"}, meta: {/home/dev/.bash_history: "0600 1000 1000"}}
      fail: {files: {/home/dev/.bash_history: "ls\n"}, meta: {/home/dev/.bash_history: "0644 1000 1000"}}

  - id: secrets:temp-private-key
    title: Readable private key material in a temporary directory ({path})
    description: Keys, PKCS#12 bundles or SSH identities left world-readable in /tmp, /var/tmp or /dev/shm are available to every local user.
    severity: medium
    probe:
      type: walk
      roots: [/tmp, /var/tmp, /dev/shm]
      match: [id_rsa, id_dsa, id_ecdsa, id_ed25519, "*.key", "*.p12", "*.pfx", "*.jks"]
      file_type: file
      max_depth: 3
      max_entries: 20000
    where: [world_readable eq true]
    expect_none: true
    remediation: Delete the file (or move it to a private location with mode 600) and rotate the key.
    fix: "shred -u {path}"
    tests:
      pass: {files: {/tmp/build.log: "x", /tmp/site.key: "k"}, meta: {/tmp/site.key: "0600 0 0", /tmp/build.log: "0644 0 0"}}
      fail: {files: {/tmp/deploy/id_rsa: "k"}, meta: {/tmp/deploy/id_rsa: "0644 1000 1000"}}

  - id: secrets:gnupg-dir-perms
    title: GnuPG home {path} is accessible to other users
    description: ~/.gnupg holds private keys and the agent socket; GnuPG itself warns about unsafe permissions on it.
    severity: low
    level: strict
    probe: {type: file, path: [/root/.gnupg, /home/*/.gnupg]}
    expect: ["mode bits_none 0077"]
    remediation: Restrict the directory to its owner.
    fix: "chmod 700 {path}"
    references: [https://www.gnupg.org/documentation/manuals/gnupg/GPG-Configuration.html]
    tests:
      pass: {meta: {/root/.gnupg: "d0700 0 0"}}
      fail: {meta: {/home/dev/.gnupg: "d0755 1000 1000"}}
